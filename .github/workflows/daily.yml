name: Daily NAV update

on:
  schedule:
    # 16:30 UTC = 21:30 PKT, well after MUFAP publishes the day's NAVs.
    # Weekdays only — MUFAP doesn't publish on weekends. The second slot is a
    # safety net for late MUFAP publishing; it commits nothing new if the
    # first run already caught everything. GitHub delays these by hours in
    # practice — harmless: history dates come from MUFAP's table, not the
    # clock, and the snapshot just refreshes whenever the run lands.
    - cron: '30 16 * * 1-5'
    - cron: '30 18 * * 1-5'
  workflow_dispatch:
    inputs:
      attempt:
        description: 'Attempt number — set automatically when a run re-dispatches itself after Cloudflare blocked it'
        required: false
        default: '1'

permissions:
  contents: write
  actions: write # to re-dispatch itself after a blocked run

# Retries and the two cron slots must not race each other on `git push`.
concurrency:
  group: nav-update
  cancel-in-progress: false

env:
  ATTEMPT: ${{ inputs.attempt || '1' }}
  # Cloudflare scores GitHub's datacenter IPs harshly: a blocked runner tends
  # to stay blocked (Sep 2026 logs show 18 straight 403s on one runner), so
  # in-job retries mostly burn minutes. A re-dispatched run lands on a fresh
  # runner with a fresh IP, which is the retry that actually helps. Three
  # attempts is plenty: blocks are rare since the scraper switched to
  # Firefox/Safari fingerprints, and the next cron slot has another go anyway.
  MAX_ATTEMPTS: '3'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dataset
        uses: actions/checkout@v5

      - name: Checkout scraper
        uses: actions/checkout@v5
        with:
          repository: saadsalmankhan/pakistan-mutual-funds-api
          path: api

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install scraper
        working-directory: api
        run: npm ci

      # Non-fatal: if Cloudflare blocks this fetch, the previous meta.json
      # (already in the checkout) still gets merged into today's snapshot.
      # Expense ratios change rarely, so a missed day here costs nothing and
      # doesn't count towards a retry.
      - name: Enrich fund metadata
        continue-on-error: true
        working-directory: api
        env:
          META_FILE: ${{ github.workspace }}/meta.json
          SCRAPE_ATTEMPTS: '6'
        run: npm run enrich

      # Snapshot only (SKIP_HISTORY): the directory page has no NAV date, and
      # GitHub starts this job hours late — often past midnight PKT — so
      # scrape-dated history rows would land under the wrong day. History is
      # merged from MUFAP's dated table in the step below instead.
      - name: Scrape MUFAP snapshot
        id: scrape
        continue-on-error: true
        working-directory: api
        env:
          DATA_FILE: ${{ github.workspace }}/funds.json
          META_FILE: ${{ github.workspace }}/meta.json
          SKIP_HISTORY: 'true'
          SCRAPE_ATTEMPTS: '6'
        run: npm run scrape

      # IndustryStatDaily publishes each NAV with its validity date at full
      # 4-decimal precision, so it doesn't matter how late this actually runs.
      # The trailing window re-merges every day (--overwrite: MUFAP rows win),
      # which also heals gaps from failed runs and picks up MUFAP corrections.
      # Runs even when the snapshot was blocked — each fetch is its own roll
      # of the dice — and the verdict step below decides what a miss means.
      - name: Merge dated NAV history
        id: history
        continue-on-error: true
        working-directory: api
        env:
          HISTORY_DIR: ${{ github.workspace }}/history
          SCRAPE_ATTEMPTS: '6'
        run: npm run backfill -- --recent=10 --overwrite

      # Commit whatever did get through, even on a partial run: a fresh
      # snapshot with stale history is still better than nothing, and the
      # retry below only has to recover what's missing.
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add funds.json history
          if [ -f meta.json ]; then git add meta.json; fi
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "NAV update $(TZ=Asia/Karachi date +%F)"
            git push
          fi

      # The run only counts as good if both the snapshot and the history
      # merge got through. Otherwise re-dispatch onto a fresh runner (see
      # MAX_ATTEMPTS above) and finish green so only a truly lost day sends
      # a failure email; the last permitted attempt fails loudly instead.
      - name: Verdict — retry on a fresh runner if anything was missed
        if: steps.scrape.outcome != 'success' || steps.history.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          missed=""
          [ "${{ steps.scrape.outcome }}" = success ] || missed="snapshot"
          [ "${{ steps.history.outcome }}" = success ] || missed="${missed:+$missed, }history"
          if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
            next=$((ATTEMPT + 1))
            echo "::warning::Cloudflare blocked the $missed fetch on attempt $ATTEMPT of $MAX_ATTEMPTS; re-dispatching as attempt $next on a fresh runner."
            gh workflow run daily.yml --ref "$GITHUB_REF_NAME" -f attempt="$next"
          else
            echo "::error::Cloudflare blocked the $missed fetch on all $MAX_ATTEMPTS attempts. The next scheduled run's 10-day history window will self-heal it."
            exit 1
          fi
