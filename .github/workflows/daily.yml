name: Daily NAV update

on:
  schedule:
    # 16:30 UTC = 21:30 PKT, well after MUFAP publishes the day's NAVs.
    # Weekdays only — MUFAP doesn't publish on weekends. The second slot is a
    # safety net for late MUFAP publishing; it commits nothing new if the
    # first run already caught everything. GitHub delays these by hours in
    # practice — harmless: history dates come from MUFAP's table, not the
    # clock, and the snapshot just refreshes whenever the run lands.
    - cron: '30 16 * * 1-5'
    - cron: '30 18 * * 1-5'
  workflow_dispatch:
    inputs:
      attempt:
        description: 'Attempt number — set automatically when a run re-dispatches itself after Cloudflare blocked it'
        required: false
        default: '1'
      need:
        description: 'Which pieces this run must fetch (any of snapshot, history, payouts, indices) — a retry only asks for what earlier attempts missed'
        required: false
        default: 'snapshot,history,payouts,indices'

permissions:
  contents: write
  actions: write # to re-dispatch itself after a blocked run

# Retries and the two cron slots must not race each other on `git push`.
concurrency:
  group: nav-update
  cancel-in-progress: false

env:
  ATTEMPT: ${{ inputs.attempt || '1' }}
  NEED: ${{ inputs.need || 'snapshot,history,payouts,indices' }}
  # Cloudflare scores GitHub's datacenter IPs harshly: even with the
  # scraper's Firefox/Safari fingerprints a runner gets only some requests
  # through, and some runners get nothing at all (Sep 2026 logs). So each
  # step rolls the dice several times, and a run that still comes up short
  # re-dispatches itself onto a fresh runner with a fresh IP, asking only for
  # the pieces still missing. Six such attempts, plus the second cron slot,
  # make a lost day very unlikely (the first unattended night needed all four
  # of the four it had back then).
  MAX_ATTEMPTS: '6'
  SCRAPE_ATTEMPTS: '8'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dataset
        uses: actions/checkout@v5

      - name: Checkout scraper
        uses: actions/checkout@v5
        with:
          repository: saadsalmankhan/pakistan-mutual-funds-api
          path: api

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install scraper
        working-directory: api
        run: npm ci

      # Snapshot only (SKIP_HISTORY): the directory page has no NAV date, and
      # GitHub starts this job hours late — often past midnight PKT — so
      # scrape-dated history rows would land under the wrong day. History is
      # merged from MUFAP's dated table in the step below instead.
      - name: Scrape MUFAP snapshot
        id: scrape
        if: contains(env.NEED, 'snapshot')
        continue-on-error: true
        working-directory: api
        env:
          DATA_FILE: ${{ github.workspace }}/funds.json
          META_FILE: ${{ github.workspace }}/meta.json
          SKIP_HISTORY: 'true'
        run: npm run scrape

      # IndustryStatDaily publishes each NAV with its validity date at full
      # 4-decimal precision, so it doesn't matter how late this actually runs.
      # The trailing window re-merges every day (--overwrite: MUFAP rows win),
      # which also heals gaps from failed runs and picks up MUFAP corrections.
      # Runs even when the snapshot was blocked — each fetch is its own roll
      # of the dice — and the verdict step below decides what a miss means.
      - name: Merge dated NAV history
        id: history
        if: contains(env.NEED, 'history')
        continue-on-error: true
        working-directory: api
        env:
          HISTORY_DIR: ${{ github.workspace }}/history
        run: npm run backfill -- --recent=10 --overwrite

      # Dividend payouts, from MUFAP's Payouts table. Without them a fund that
      # pays out looks like it lost money on its ex-date; with them returns are
      # total returns. The trailing window re-merges every day, so a missed
      # day heals itself.
      - name: Merge payouts
        id: payouts
        if: contains(env.NEED, 'payouts')
        continue-on-error: true
        working-directory: api
        env:
          PAYOUTS_DIR: ${{ github.workspace }}/payouts
        run: npm run payouts -- --recent=45

      # KSE-100 and KMI-30 closes from the PSX Data Portal: the benchmarks
      # fund returns are held against. PSX only serves ~5 years, so merging
      # daily is what lets this history outgrow that window.
      - name: Merge index history
        id: indices
        if: contains(env.NEED, 'indices')
        continue-on-error: true
        working-directory: api
        env:
          INDEX_DIR: ${{ github.workspace }}/indices
        run: npm run indices

      # Expense ratios change rarely and this page is the one Cloudflare
      # blocks hardest, so it goes last, runs on the first attempt only and
      # never counts towards a retry. If it's blocked, the previous meta.json
      # (already in the checkout) stays, and the next snapshot merges it.
      - name: Enrich fund metadata
        if: env.ATTEMPT == '1'
        continue-on-error: true
        working-directory: api
        env:
          META_FILE: ${{ github.workspace }}/meta.json
        run: npm run enrich

      # The who-beat-the-market table: every fund's total returns next to its
      # benchmark. Pure computation over the files above, so it runs on every
      # attempt with whatever is freshest.
      - name: Build performance table
        continue-on-error: true
        working-directory: api
        env:
          DATA_FILE: ${{ github.workspace }}/funds.json
          HISTORY_DIR: ${{ github.workspace }}/history
          PAYOUTS_DIR: ${{ github.workspace }}/payouts
          INDEX_DIR: ${{ github.workspace }}/indices
          PERFORMANCE_FILE: ${{ github.workspace }}/performance.json
        run: npm run performance

      # Commit whatever did get through, even on a partial run: a fresh
      # snapshot with stale history is still better than nothing, and the
      # retry below only has to recover what's missing.
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add funds.json history
          for f in meta.json performance.json payouts indices; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "NAV update $(TZ=Asia/Karachi date +%F)"
            git push
          fi

      # The run only counts as good if every piece it was asked for got
      # through. Otherwise re-dispatch onto a fresh runner (see MAX_ATTEMPTS
      # above) asking only for what's still missing, and finish green so only
      # a truly lost day sends a failure email; the last permitted attempt
      # fails loudly instead. A step that was skipped (not asked for) is fine.
      - name: Verdict — retry on a fresh runner if anything was missed
        if: >-
          steps.scrape.outcome == 'failure' || steps.history.outcome == 'failure' ||
          steps.payouts.outcome == 'failure' || steps.indices.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          missed=""
          [ "${{ steps.scrape.outcome }}" = failure ] && missed="snapshot"
          [ "${{ steps.history.outcome }}" = failure ] && missed="${missed:+$missed,}history"
          [ "${{ steps.payouts.outcome }}" = failure ] && missed="${missed:+$missed,}payouts"
          [ "${{ steps.indices.outcome }}" = failure ] && missed="${missed:+$missed,}indices"
          if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
            next=$((ATTEMPT + 1))
            echo "::warning::Blocked on the $missed fetch on attempt $ATTEMPT of $MAX_ATTEMPTS; re-dispatching as attempt $next on a fresh runner for: $missed."
            # GitHub's API itself hiccups now and then (a 502 here once turned
            # a recoverable night into a red run), so give the dispatch a few
            # tries before declaring the retry chain broken.
            for try in 1 2 3 4 5; do
              if gh workflow run daily.yml --ref "$GITHUB_REF_NAME" -f attempt="$next" -f need="$missed"; then
                exit 0
              fi
              echo "dispatch attempt $try failed, retrying in 30s"
              sleep 30
            done
            echo "::error::Could not re-dispatch the workflow after 5 tries (GitHub API errors). Still missing: $missed. The next scheduled run's trailing windows will self-heal it."
            exit 1
          else
            echo "::error::Blocked on the $missed fetch on all $MAX_ATTEMPTS attempts. The next scheduled run's trailing windows will self-heal it."
            exit 1
          fi
