name: Daily NAV update

on:
  schedule:
    # 16:30 UTC = 21:30 PKT, well after MUFAP publishes the day's NAVs.
    # Weekdays only — MUFAP doesn't publish on weekends. The second run is a
    # safety net: Cloudflare 403s some GitHub runner IPs, so a later retry on
    # a fresh runner usually gets through; it commits nothing new if the
    # first run already succeeded. GitHub delays these by hours in practice —
    # harmless: history dates come from MUFAP's table, not the clock, and the
    # snapshot just refreshes whenever the run lands.
    - cron: '30 16 * * 1-5'
    - cron: '30 18 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dataset
        uses: actions/checkout@v5

      - name: Checkout scraper
        uses: actions/checkout@v5
        with:
          repository: saadsalmankhan/pakistan-mutual-funds-api
          path: api

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install scraper
        working-directory: api
        run: npm ci

      # Non-fatal: if Cloudflare blocks this fetch, the previous meta.json
      # (already in the checkout) still gets merged into today's snapshot.
      - name: Enrich fund metadata
        continue-on-error: true
        working-directory: api
        env:
          META_FILE: ${{ github.workspace }}/meta.json
          SCRAPE_ATTEMPTS: '6'
        run: npm run enrich

      # Snapshot only (SKIP_HISTORY): the directory page has no NAV date, and
      # GitHub starts this job hours late — often past midnight PKT — so
      # scrape-dated history rows would land under the wrong day. History is
      # merged from MUFAP's dated table in the step below instead.
      - name: Scrape MUFAP snapshot
        id: scrape
        continue-on-error: true
        working-directory: api
        env:
          DATA_FILE: ${{ github.workspace }}/funds.json
          META_FILE: ${{ github.workspace }}/meta.json
          SKIP_HISTORY: 'true'
          SCRAPE_ATTEMPTS: '6'
        run: npm run scrape

      - name: Retry scrape after cooldown
        if: steps.scrape.outcome == 'failure'
        working-directory: api
        env:
          DATA_FILE: ${{ github.workspace }}/funds.json
          META_FILE: ${{ github.workspace }}/meta.json
          SKIP_HISTORY: 'true'
          SCRAPE_ATTEMPTS: '6'
        run: |
          sleep 120
          npm run scrape

      # IndustryStatDaily publishes each NAV with its validity date at full
      # 4-decimal precision, so it doesn't matter how late this actually runs.
      # The trailing window re-merges every day (--overwrite: MUFAP rows win),
      # which also heals gaps from failed runs and picks up MUFAP corrections.
      # Non-fatal: tomorrow's window covers anything today's run missed.
      - name: Merge dated NAV history
        continue-on-error: true
        working-directory: api
        env:
          HISTORY_DIR: ${{ github.workspace }}/history
          SCRAPE_ATTEMPTS: '6'
        run: npm run backfill -- --recent=10 --overwrite

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add funds.json history
          if [ -f meta.json ]; then git add meta.json; fi
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "NAV update $(TZ=Asia/Karachi date +%F)"
            git push
          fi
